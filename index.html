<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinite Kitten Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <div id="loading" class="hidden">
            <div class="spinner"></div>
            <p>Generating adorable kitten...</p>
        </div>
        
        <div id="cat-display">
            <h2 id="cat-name" class="cat-name"></h2>
            <img id="cat-image" src="" alt="Generated Cat" />
            <div id="cat-prompt" class="cat-info"></div>
        </div>
        
        <div id="controls">
            <button id="back-btn" class="control-btn" disabled>
                <span>←</span> Back
            </button>
            
            <button id="next-btn" class="control-btn primary">
                Next <span>→</span>
            </button>
            
            <button id="download-btn" class="control-btn">
                📥 Download
            </button>
            
            <button id="share-btn" class="control-btn">
                💬 Share to Comments
            </button>
        </div>
        
        <div id="history-counter">
            Cat <span id="current-index">1</span> of <span id="total-cats">1</span>
        </div>
    </div>
    
    <script type="module" src="script.js"></script>

</body>
</html>
